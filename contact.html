<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — jorm.objects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="nav__logo">jorm.objects</a>
    <ul class="nav__links">
      <li><a href="work.html">Work</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
    <button class="nav__hamburger" aria-label="Menu">&#9776;</button>
  </nav>

  <div class="nav__overlay">
    <button class="nav__close" aria-label="Close">&times;</button>
    <a href="work.html">Work</a>
    <a href="shop.html">Shop</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </div>

  <main>
    <div class="page-header">
      <h1>Contact</h1>
    </div>

    <section class="contact">
      <form class="contact__form">
        <div class="form__group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form__group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form__group">
          <label for="subject">Subject</label>
          <select id="subject" name="subject">
            <option value="general">General Inquiry</option>
            <option value="purchase">Purchase Inquiry</option>
            <option value="collaboration">Collaboration</option>
            <option value="press">Press</option>
          </select>
        </div>
        <div class="form__group">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <button type="submit" class="form__submit">Send Message &rarr;</button>
      </form>

      <div class="contact__info">
        <h2>Studio</h2>
        <p>jorm.objects<br>Notelaatstraat 96<br>9000 Ghent<br>Belgium</p>
        <p><a href="mailto:hello@jorm-objects.com">info@jorm.be</a></p>
        <p><a href="https://www.instagram.com/jorm.objects" target="_blank" rel="noopener">@jorm.objects</a></p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span>&copy; 2026 jorm.objects</span>
    <ul class="footer__links">
      <li><a href="https://www.instagram.com/jorm.objects" target="_blank" rel="noopener">Instagram</a></li>
    </ul>
  </footer>

  <script>
    document.querySelector('.nav__hamburger').addEventListener('click', () => {
      document.querySelector('.nav__overlay').classList.add('open');
    });
    document.querySelector('.nav__close').addEventListener('click', () => {
      document.querySelector('.nav__overlay').classList.remove('open');
    });

    const params = new URLSearchParams(window.location.search);
    const piece = params.get('piece');
    if (piece) {
      const subject = document.querySelector('#subject');
      subject.value = 'purchase';
      const message = document.querySelector('#message');
      message.value = 'I am interested in: ' + piece;
      message.focus();
    }
  </script>
</body>
</html>
