<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work — jorm.objects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="nav__logo">jorm.objects</a>
    <ul class="nav__links">
      <li><a href="work.html" class="active">Work</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <button class="nav__hamburger" aria-label="Menu">&#9776;</button>
  </nav>

  <div class="nav__overlay">
    <button class="nav__close" aria-label="Close">&times;</button>
    <a href="work.html">Work</a>
    <a href="shop.html">Shop</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </div>

  <main>
    <header class="page-header">
      <h1>Work</h1>
    </header>

    <div class="filters">
      <button class="filters__btn active" data-category="all">All</button>
      <button class="filters__btn" data-category="furniture">Furniture</button>
      <button class="filters__btn" data-category="lighting">Lighting</button>
      <button class="filters__btn" data-category="sculpture">Sculpture</button>
      <button class="filters__btn" data-category="objects">Objects</button>
    </div>

    <div class="grid">
      <a href="work/arc-bench.html" class="grid__item" data-category="furniture">
        <div class="grid__img">600 &times; 600</div>
        <div class="grid__info">
          <div class="grid__title">Arc Bench</div>
          <div class="grid__meta">2025</div>
        </div>
      </a>
      <a href="work/void-shelf.html" class="grid__item" data-category="furniture">
        <div class="grid__img">600 &times; 600</div>
        <div class="grid__info">
          <div class="grid__title">Void Shelf</div>
          <div class="grid__meta">2024</div>
        </div>
      </a>
      <a href="work/tension-lamp.html" class="grid__item" data-category="lighting">
        <div class="grid__img">600 &times; 600</div>
        <div class="grid__info">
          <div class="grid__title">Tension Lamp</div>
          <div class="grid__meta">2024</div>
        </div>
      </a>
      <a href="work/mass-object.html" class="grid__item" data-category="sculpture">
        <div class="grid__img">600 &times; 600</div>
        <div class="grid__info">
          <div class="grid__title">Mass Object I</div>
          <div class="grid__meta">2023</div>
        </div>
      </a>
      <a href="work/form-study.html" class="grid__item" data-category="sculpture">
        <div class="grid__img">600 &times; 600</div>
        <div class="grid__info">
          <div class="grid__title">Form Study II</div>
          <div class="grid__meta">2023</div>
        </div>
      </a>
      <a href="work/ritual-vessel.html" class="grid__item" data-category="objects">
        <div class="grid__img">600 &times; 600</div>
        <div class="grid__info">
          <div class="grid__title">Ritual Vessel</div>
          <div class="grid__meta">2022</div>
        </div>
      </a>
    </div>
  </main>

  <footer class="footer">
    <span>&copy; 2026 jorm.objects</span>
    <ul class="footer__links">
      <li><a href="https://instagram.com" target="_blank" rel="noopener">Instagram</a></li>
    </ul>
  </footer>

  <script>
    document.querySelector('.nav__hamburger').addEventListener('click', () => {
      document.querySelector('.nav__overlay').classList.add('open');
    });
    document.querySelector('.nav__close').addEventListener('click', () => {
      document.querySelector('.nav__overlay').classList.remove('open');
    });

    const buttons = document.querySelectorAll('.filters__btn');
    const items = document.querySelectorAll('.grid__item');
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const cat = btn.dataset.category;
        items.forEach(item => {
          item.style.display = (cat === 'all' || item.dataset.category === cat) ? '' : 'none';
        });
      });
    });
  </script>
</body>
</html>
